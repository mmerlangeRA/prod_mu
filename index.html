<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street furniture catalogue</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#20312e;background:#f4f6f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}header{background:#173d34;color:#fff;padding:32px max(24px,calc((100vw - 1440px)/2))}header p{color:#c1d7cd;margin:8px 0 0}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:600}.shell{max-width:1488px;margin:auto;padding:24px}.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}.stat strong{font-size:24px;margin-right:7px}.stat span{color:#c1d7cd;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin-bottom:20px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600;color:#4d605a}input,select{border:1px solid #cbd5ce;background:white;border-radius:8px;padding:11px;color:#20312e;min-width:0}.search{flex:1;min-width:200px}.check{flex-direction:row;align-items:center;padding-bottom:12px}.count{font-size:14px;color:#65766f;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{border:1px solid #dce3dd;border-radius:12px;background:white;padding:0;text-align:left;overflow:hidden;color:inherit;transition:box-shadow .15s,transform .15s}.card:hover{box-shadow:0 8px 22px #163d3414;transform:translateY(-2px)}.picture{height:210px;display:flex;align-items:center;justify-content:center;padding:20px;background-color:#fff}.picture img{width:100%;height:100%;object-fit:contain}.checker .picture,.checker .preview{background-color:#fff;background-image:conic-gradient(#e9ede9 25%,transparent 0 50%,#e9ede9 0 75%,transparent 0);background-size:20px 20px}.card-body{padding:16px;border-top:1px solid #edf0eb;min-height:112px}.category{font-size:11px;color:#527567;text-transform:uppercase;letter-spacing:1.1px}.card h2{font-size:15px;line-height:1.4;margin:7px 0;overflow-wrap:anywhere}.meta{color:#718077;font-size:12px}.empty{padding:48px;text-align:center;color:#718077}.no-image{color:#87978e;font-size:14px}.structure{margin-top:30px;border-top:1px solid #d1dcd4;padding-top:20px}.structure summary{cursor:pointer;font-weight:600}.structure pre{max-height:460px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;background:#edf1ec;padding:18px;border-radius:8px}dialog{border:0;border-radius:16px;padding:0;width:min(1080px,94vw);max-height:92vh;color:inherit}dialog::backdrop{background:#102a25b8}.dialog-top{display:flex;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid #e0e6df;align-items:center}.dialog-top h2{margin:4px 0;font-size:20px;overflow-wrap:anywhere}.close,.action{padding:10px 15px;border-radius:7px;border:1px solid #cbd5ce;background:white;color:#254f41;text-decoration:none;display:inline-block;font-size:14px}.details{display:grid;grid-template-columns:1.15fr 1fr}.preview{min-height:360px;display:flex;align-items:center;justify-content:center;padding:28px}.preview img{max-width:100%;max-height:65vh;object-fit:contain}.info{padding:24px;background:#f7f9f5;min-width:0}.info p{font-size:13px;line-height:1.6;color:#61746a;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}button:focus-visible,a:focus-visible{outline:3px solid #65a589;outline-offset:3px}footer{margin-top:25px;font-size:12px;color:#6b7d72}@media(max-width:600px){header{padding:24px}h1{font-size:27px}.shell{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.picture{height:165px;padding:12px}.card-body{padding:12px}.details{grid-template-columns:1fr}.preview{min-height:240px}.toolbar>label:not(.check){flex:1;min-width:130px}.toolbar>.search{min-width:100%}.dialog-top{padding:16px}.stats{gap:16px}}
</style>
</head>
<body>
<header><div class="eyebrow">JSON explorer / Asset library</div><h1 id="pageTitle">Street furniture catalogue</h1><p id="source"></p><div class="stats" id="stats"></div></header>
<main class="shell">
<div class="toolbar">
<label>Clavier JSON<input id="loadJson" type="file" accept=".json,application/json" multiple></label>
<label class="search">Search catalogue<input id="search" type="search" placeholder="Search names, values, codes…"></label>
<label>Field<select id="part"><option value="">All fields</option></select></label>
<label>Category<select id="category"><option value="">All categories</option></select></label>
<label class="check"><input id="imagesOnly" type="checkbox"> Images only</label>
<label class="check"><input id="checker" type="checkbox"> Transparency grid</label>
<label>Export max width (px)<input id="exportWidth" type="number" min="1" step="1" value="128" required style="width:150px"></label>
<button class="action" id="exportAll" type="button">Export all images (.zip)</button>
</div>
<p class="count" id="exportStatus" role="status"></p>
<p class="count" id="count" aria-live="polite"></p><div class="grid" id="grid"></div>
<details class="structure"><summary>Explore JSON structure & configuration</summary><p class="count">All JSON fields are preserved below for inspection.</p><pre id="structure"></pre></details>
<footer>Images are matched from the <code>images</code> folder using each entry's code. Select an item to inspect it or download its image. This page works offline.</footer>
</main>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-top"><div><span class="category" id="detailCategory"></span><h2 id="detailTitle"></h2></div><button class="close" id="close">Close</button></div><div class="details"><div class="preview" id="preview"></div><div class="info"><div class="actions" id="actions"></div><p id="imageInfo"></p><p id="path"></p><pre id="raw"></pre></div></div></dialog>
<script id="catalogue" type="application/json"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), records=[];
const labels={banc:'Benches',barriere:'Barriers',corbeille:'Bins',potelet:'Bollards'};
const displayName=s=>String(s||'Unnamed').replaceAll('_',' ');
const shortJSON=value=>JSON.stringify(value,null,2);
const imageExtensions=['png','jpg','jpeg','webp','gif'];
function imageCandidateURL(code,extension){return new URL('images/'+encodeURIComponent(code)+'.'+extension,document.baseURI).href;}
function findCodeImage(code){
 if(typeof code!=='string'||!code.trim())return Promise.resolve('');
 const clean=code.trim();let index=0;
 return new Promise(resolve=>{
  const probe=new Image();
  const next=()=>{if(index>=imageExtensions.length){resolve('');return;}probe.src=imageCandidateURL(clean,imageExtensions[index++]);};
  probe.onload=()=>resolve(probe.src);probe.onerror=next;next();
 });
}
// Resize exports locally, preserving aspect ratio and transparency without upscaling.
function exportDimensions(width,height,maxWidth){
 const targetWidth=Math.min(width,maxWidth);
 return {width:targetWidth,height:Math.max(1,Math.round(height*targetWidth/width))};
}
async function resizeForExport(record,maxWidth){
 const img=new Image();
 await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Cannot decode '+record.item.name));img.src=record.url;});
 const size=exportDimensions(img.naturalWidth,img.naturalHeight,maxWidth);
 const canvas=document.createElement('canvas');canvas.width=size.width;canvas.height=size.height;
 const context=canvas.getContext('2d');
 if(!context)throw new Error('Image resizing is unavailable in this browser.');
 context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
 context.drawImage(img,0,0,size.width,size.height);
 const url=canvas.toDataURL('image/png');
 if(!url.startsWith('data:image/png;base64,'))throw new Error('Cannot resize '+record.item.name);
 return {...record,url};
}
// Store exported image bytes in a UTF-8 ZIP; no external library needed.
function exportFilename(name, extension, used){
 let base=String(name||'image').normalize('NFC').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_').replace(/[. ]+$/g,'').slice(0,160)||'image';
 if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(base))base='_'+base;
 let filename=base+extension, suffix=2;
 while(used.has(filename.toLocaleLowerCase()))filename=base+'_'+(suffix++)+extension;
 used.add(filename.toLocaleLowerCase());return filename;
}
function createImagesZip(entries){
 const encoder=new TextEncoder(),used=new Set(),local=[],central=[];
 const table=Uint32Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
 let offset=0,count=0;
 for(const {item,url} of entries){
  if(!url)continue;
  const match=/^data:(image\/[\w.+-]+);base64,([\s\S]*)$/.exec(url);
  if(!match)throw new Error('Unsupported image encoding for '+item.name);
  const extension=({'image/png':'.png','image/jpeg':'.jpg','image/gif':'.gif','image/webp':'.webp','image/svg+xml':'.svg'})[match[1]];
  if(!extension)throw new Error('Unsupported image format for '+item.name);
  const name=encoder.encode(exportFilename(item.name,extension,used));
  const bytes=Uint8Array.from(atob(match[2]),c=>c.charCodeAt(0));
  let crc=0xffffffff;for(const b of bytes)crc=table[(crc^b)&255]^(crc>>>8);crc=(crc^0xffffffff)>>>0;
  const header=new Uint8Array(30+name.length),h=new DataView(header.buffer);
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);
  h.setUint32(14,crc,true);h.setUint32(18,bytes.length,true);h.setUint32(22,bytes.length,true);h.setUint16(26,name.length,true);header.set(name,30);
  const directory=new Uint8Array(46+name.length),d=new DataView(directory.buffer);
  d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,33,true);
  d.setUint32(16,crc,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);directory.set(name,46);
  local.push(header,bytes);central.push(directory);offset+=header.length+bytes.length;count++;
 }
 const end=new Uint8Array(22),e=new DataView(end.buffer);
 e.setUint32(0,0x06054b50,true);e.setUint16(8,count,true);e.setUint16(10,count,true);e.setUint32(12,central.reduce((n,b)=>n+b.length,0),true);e.setUint32(16,offset,true);
 return new Blob([...local,...central,end],{type:'application/zip'});
}
let images=0,hasCatalogue=false,loadGeneration=0;
async function loadSources(list){
 const generation=++loadGeneration;
 hasCatalogue=list.length>0;
 $('catalogue').textContent=hasCatalogue?JSON.stringify(list):'';
 const rubricNames=hasCatalogue?[...new Set(list.flatMap(source=>(source.data.rubrics||[]).map(rubric=>String(rubric.name||'').trim())).filter(Boolean))]:[];
 const pageTitle=rubricNames.length?rubricNames.join(' · '):'Street furniture catalogue';
 $('pageTitle').textContent=pageTitle;
 document.title=pageTitle;
 $('search').value='';
 $('imagesOnly').checked=false;
 records.length=0;
 for(const source of list)for(const [ri,rubric] of (source.data.rubrics||[]).entries())for(const [pi,part] of (rubric.parts||[]).entries())for(const [li,item] of (part.lexicons||[]).entries()){
  const prefix=(item.name||'').split('_')[0];records.push({item,part:part.name,category:labels[prefix]||part.name,source:source.name,path:`rubrics[${ri}].parts[${pi}].lexicons[${li}]`,url:''});
 }
 $('source').textContent=hasCatalogue?list.map(s=>s.name).join(' · '):'Choose one or more Clavier JSON files to get started.';
 images=records.filter(r=>r.url).length;
 $('stats').replaceChildren();
 for(const [n,label] of [[records.length,'entries'],[images,'images'],[new Set(records.filter(r=>r.url).map(r=>r.category)).size,'image categories']]){const stat=document.createElement('div');stat.className='stat';const strong=document.createElement('strong');strong.textContent=n;const span=document.createElement('span');span.textContent=label;stat.append(strong,span);$('stats').append(stat);}
 for(const [id,values,all] of [['part',records.map(r=>r.part),'All fields'],['category',records.map(r=>r.category),'All categories']]){
  $(id).replaceChildren(new Option(all,''));
  for(const value of new Set(values))$(id).append(new Option(value,value));
 }
 $('structure').textContent=hasCatalogue?shortJSON(list):'';
 $('exportAll').disabled=!images;
 render();
 if(!hasCatalogue)return;
 $('exportStatus').textContent='Checking images folder for files matching catalogue codes…';
 const urls=await Promise.all(records.map(record=>findCodeImage(record.item.code)));
 if(generation!==loadGeneration)return;
 records.forEach((record,index)=>record.url=urls[index]);
 images=records.filter(record=>record.url).length;
 $('stats').replaceChildren();
 for(const [n,label] of [[records.length,'entries'],[images,'images'],[new Set(records.filter(r=>r.url).map(r=>r.category)).size,'image categories']]){const stat=document.createElement('div');stat.className='stat';const strong=document.createElement('strong');strong.textContent=n;const span=document.createElement('span');span.textContent=label;stat.append(strong,span);$('stats').append(stat);}
 $('exportAll').disabled=!images;
 render();
}
function openDetail(record){const {item,url}=record;$('detailTitle').textContent=displayName(item.name);$('detailCategory').textContent=record.category+' / '+record.part;$('path').textContent=record.source+' → '+record.path;$('raw').textContent=shortJSON(item);$('preview').replaceChildren();$('actions').replaceChildren();$('imageInfo').textContent=url?'Loading image dimensions…':'No matching image was found in the images folder for code '+(item.code||'(empty)')+'.';
 if(url){const img=new Image();img.alt=item.name;img.onload=()=>{$('imageInfo').textContent=`${img.naturalWidth} × ${img.naturalHeight} pixels · Embedded image`;};img.onerror=()=>{$('imageInfo').textContent='This image could not be decoded.';};img.src=url;$('preview').append(img);const download=document.createElement('a');download.className='action';download.href=url;download.download=(item.name||'image')+(url.startsWith('data:image/jpeg')?'.jpg':url.startsWith('data:image/webp')?'.webp':url.startsWith('data:image/gif')?'.gif':'.png');download.textContent='Download image';$('actions').append(download);}else{$('preview').textContent='No image';}
 $('detail').showModal();}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const visible=records.filter(r=>(!$('imagesOnly').checked||r.url)&&(!$('part').value||r.part===$('part').value)&&(!$('category').value||r.category===$('category').value)&&[r.item.name,r.item.value,r.item.code,r.item.id,r.category].join(' ').replaceAll('_',' ').toLocaleLowerCase().includes(q.replaceAll('_',' ')));$('count').textContent=`${visible.length} of ${records.length} entries · Select a card for full details`;$('grid').replaceChildren();
 for(const r of visible){const card=document.createElement('button');card.className='card';card.setAttribute('aria-label','Inspect '+r.item.name);const pic=document.createElement('div');pic.className='picture';if(r.url){const img=new Image();img.alt=r.item.name;img.loading='lazy';img.src=r.url;img.onerror=()=>{pic.textContent='Image unavailable';};pic.append(img);}else{pic.classList.add('no-image');pic.textContent='No image';}const body=document.createElement('div');body.className='card-body';const category=document.createElement('div');category.className='category';category.textContent=r.category;const name=document.createElement('h2');name.textContent=displayName(r.item.name);const meta=document.createElement('div');meta.className='meta';meta.textContent=`ID ${r.item.id} · ${r.part}`;body.append(category,name);if(r.item.value&&r.item.value!==r.item.name){const value=document.createElement('p');value.className='meta';value.textContent=r.item.value;body.append(value);}body.append(meta);card.append(pic,body);card.onclick=()=>openDetail(r);$('grid').append(card);}
 if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=hasCatalogue?'No matching entries. Try another search or filter.':'Choose a Clavier JSON file above to display its entries.';$('grid').append(empty);}}
for(const id of ['search','part','category','imagesOnly'])$(id).addEventListener('input',render);
$('checker').onchange=()=>document.body.classList.toggle('checker',$('checker').checked);
$('loadJson').addEventListener('change',async()=>{
 const files=[...$('loadJson').files];if(!files.length)return;
 try{
  const loaded=[];
  for(const file of files){
   let data;try{data=JSON.parse(await file.text());}catch{throw new Error(file.name+' is not valid JSON.');}
   if(!data||!Array.isArray(data.rubrics))throw new Error(file.name+' is not a catalogue (missing "rubrics" array).');
   loaded.push({name:file.name,data});
  }
  await loadSources(loaded);
  $('exportStatus').textContent='Loaded '+loaded.map(s=>s.name).join(', ')+'.';
 }catch(error){$('exportStatus').textContent='Load failed: '+error.message;}
 $('loadJson').value='';
});
$('exportAll').onclick=async()=>{
 const widthInput=$('exportWidth'),maxWidth=Number(widthInput.value);
 if(!widthInput.reportValidity())return;
 if(!Number.isSafeInteger(maxWidth)||maxWidth<1){$('exportStatus').textContent='Enter a positive whole number for the maximum width.';widthInput.focus();return;}
 const button=$('exportAll');button.disabled=true;widthInput.disabled=true;$('exportStatus').textContent='Preparing all '+images+' images at max width '+maxWidth+' px…';
 await new Promise(resolve=>setTimeout(resolve,0));
 try{
  const resized=[];
  for(const record of records){if(!record.url)continue;resized.push(await resizeForExport(record,maxWidth));$('exportStatus').textContent='Preparing image '+resized.length+' of '+images+'…';}
  const zip=createImagesZip(resized),url=URL.createObjectURL(zip),link=document.createElement('a');
  link.href=url;link.download='mobilier-urbain-cholet-images-'+maxWidth+'px.zip';document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $('exportStatus').textContent='ZIP download started: '+images+' named images, maximum width '+maxWidth+' px. Proportions preserved; smaller images kept at original size.';
 }catch(error){$('exportStatus').textContent='Export failed: '+error.message;}
 finally{button.disabled=!images;widthInput.disabled=false;}
};
$('close').onclick=()=>$('detail').close();
$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}});
void loadSources([]);
</script>
</body>
</html>
